name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ] # 或 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 改用 Node 22 消除警告

      - name: Install Dependencies
        # 若程式碼在 github_frontend 子資料夾，請取消下行的註解：
        # working-directory: ./github_frontend
        run: npm install # 使用 npm install 代替 npm ci

      - name: Build Project
        # 若程式碼在 github_frontend 子資料夾，請取消下行的註解：
        # working-directory: ./github_frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }} # 或直接填：https://anonymousxinmin-backed.onrender.com/api
          VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAD_Exkr-g2QpaNgb"
          VITE_SUPABASE_URL: "https://yeqvfyxwuyyjlxqtzvbc.supabase.co"
          VITE_SUPABASE_ANON_KEY: "YOUR_SUPABASE_ANON_KEY"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 若程式碼在子資料夾，請改為 ./github_frontend/dist
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
