name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ] # 或 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: ./github_frontend # 👈 指向子資料夾
        run: npm install

      - name: Build Project
        working-directory: ./github_frontend # 👈 指向子資料夾
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAD_Exkr-g2QpaNgb"
          VITE_SUPABASE_URL: "https://yeqvfyxwuyyjlxqtzvbc.supabase.co"
          VITE_SUPABASE_ANON_KEY: "YOUR_SUPABASE_ANON_KEY"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github_frontend/dist # 👈 上傳打包後的子資料夾產物

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
