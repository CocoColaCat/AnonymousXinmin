<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>匿名新民 - 匿名貼文與討論社群</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          let origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return origFetch;
            },
            set(val) {
              origFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
